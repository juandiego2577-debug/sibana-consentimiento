<meta name="apple-mobile-web-app-title" content="Consentimiento Sibana">
<script>
(function(){
  // Reusa el mismo ícono que ya está puesto como favicon (el mismo logo
  // que usa la Agenda), para no repetir la imagen otra vez en el archivo.
  var iconHref = document.querySelector('link[rel="icon"]').href;
  var manifest = {
    name: "Sibana - Consentimiento",
    short_name: "Consentimiento",
    start_url: ".",
    display: "standalone",
    background_color: "#161310",
    theme_color: "#161310",
    icons: [
      {src: iconHref, sizes: "200x200", type: "image/png", purpose: "any maskable"}
    ]
  };
  var blob = new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"});
  var manifestLink = document.createElement("link");
  manifestLink.rel = "manifest";
  manifestLink.href = URL.createObjectURL(blob);
  document.head.appendChild(manifestLink);

  var appleIcon = document.createElement("link");
  appleIcon.rel = "apple-touch-icon";
  appleIcon.href = iconHref;
  document.head.appendChild(appleIcon);
})();
</script>
<style>
  :root{
    --bg:#161310;
    --bg-elev:#1f1a14;
    --panel:#221c15;
    --gold:#c8a24e;
    --gold-dim:#8f7439;
    --cream:#f3ead6;
    --muted:#a89a83;
    --line:rgba(243,234,214,0.13);
    --rose:#b1604a;
    --sage:#6f8266;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;}
  .app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 18px 70px;}
  .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;}

  .brand{text-align:center;margin-bottom:6px;}
  .brand .mark{font-family:Georgia,serif;font-style:italic;font-size:34px;color:var(--gold);letter-spacing:1px;}
  .brand .sub{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.14em;color:var(--muted);margin-top:2px;}

  .wrap{width:100%;max-width:540px;}

  .progress{display:flex;align-items:center;justify-content:center;gap:6px;margin:26px 0 30px;}

let sigCanvas, sigCtx, drawing=false, hasSig=false, lastPt=null;
function setupSignaturePad(){
  sigCanvas = document.getElementById('sigpad');
  if(!sigCanvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = sigCanvas.getBoundingClientRect();
  sigCanvas.width = rect.width * ratio;
  sigCanvas.height = rect.height * ratio;
  sigCtx = sigCanvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2;
  sigCtx.lineCap = 'round';
  sigCtx.strokeStyle = '#1a1610';
  if(state.firmaDataUrl){
    const img = new Image();
    img.onload = ()=> sigCtx.drawImage(img,0,0,rect.width,rect.height);
    img.src = state.firmaDataUrl;
    hasSig = true;
  }
  function pos(e){
    const r = sigCanvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX-r.left, y: p.clientY-r.top};
  }
  function start(e){ e.preventDefault(); drawing=true; lastPt=pos(e); }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(lastPt.x, lastPt.y);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
    lastPt = p;
    hasSig = true;
  }
  function end(){ drawing=false; if(hasSig) state.firmaDataUrl = sigCanvas.toDataURL('image/png'); }
  sigCanvas.addEventListener('mousedown', start);
  sigCanvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  sigCanvas.addEventListener('touchstart', start, {passive:false});
  sigCanvas.addEventListener('touchmove', move, {passive:false});
  sigCanvas.addEventListener('touchend', end);
  document.getElementById('clearSig').addEventListener('click', ()=>{
    sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);
    hasSig = false;
    state.firmaDataUrl = null;
  });
}

function bindInputs(){
  document.querySelectorAll('[data-bind]').forEach(el=>{
    el.addEventListener('input', ()=>{ state[el.dataset.bind] = el.value; });
  });
  document.querySelectorAll('[data-yn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state[btn.dataset.yn] = btn.dataset.val === 'si';
      renderApp();
    });
  });
  const ac = document.getElementById('acepta_cuidados');
  if(ac) ac.addEventListener('change', e=> state.acepta_cuidados = e.target.checked);
  const at = document.getElementById('acepta_terminos');
  if(at) at.addEventListener('change', e=> state.acepta_terminos = e.target.checked);
  const df = document.getElementById('declara_firma');
  if(df) df.addEventListener('change', e=> state.declara_firma = e.target.checked);
}
function showErr(msg){
  const box = document.getElementById('errbox');
  if(box){ box.textContent = msg; box.classList.add('show'); }
}
function validaRut(rutStr){
  const rut = (rutStr||'').replace(/\./g,'').replace(/-/g,'').trim().toUpperCase();
  if(rut.length < 2) return false;
  const cuerpo = rut.slice(0,-1);
  const dv = rut.slice(-1);
  if(!/^\d+$/.test(cuerpo)) return false;
  let suma = 0, multiplo = 2;
  for(let i=cuerpo.length-1;i>=0;i--){
    suma += parseInt(cuerpo[i],10)*multiplo;
    multiplo = multiplo<7 ? multiplo+1 : 2;
  }
  const resto = 11 - (suma % 11);
  const dvEsperado = resto===11 ? '0' : resto===10 ? 'K' : String(resto);
  return dv === dvEsperado;
}
function validateStep(){
  if(state.step===0){
    if(!state.nombre.trim()) return "Ingresa tu nombre completo.";
    if(!state.rut.trim()) return "Ingresa tu RUT.";
    if(!validaRut(state.rut)) return "El RUT ingresado no parece válido. Revisa que esté bien escrito (con su dígito verificador).";
    if(!state.telefono.trim()) return "Ingresa un teléfono de contacto.";
  }
  if(state.step===1){
    const req = ['alergias','diabetes','hipertension','vih','hepatitis','enf_inmunes','cond_piel','herpes'];
    for(const f of req){ if(state[f]===null) return "Responde todas las preguntas del historial médico."; }
    if(state.alergias===true && !state.alergias_detalle.trim()) return "Cuéntanos a qué eres alérgico/a.";
    if(state.cond_piel===true && !state.cond_piel_detalle.trim()) return "Cuéntanos qué condición de piel tienes.";
    if(state.herpes===true && !state.herpes_detalle.trim()) return "Cuéntanos más sobre el herpes o las ampollas de fiebre.";
  }
  if(state.step===2){
    if(state.diseno_aprobado===null) return "Confirma si estás de acuerdo con el color, diseño y grosor aplicados.";
    if(state.diseno_aprobado===false) return "Conversa con tu especialista antes de continuar: el diseño debe estar aprobado para poder firmar.";
  }
  if(state.step===3){
    if(!state.acepta_cuidados) return "Marca que leíste los cuidados posteriores para continuar.";
  }
  if(state.step===4){
    if(!state.acepta_terminos) return "Debes aceptar los términos del consentimiento.";
    if(!state.firmaDataUrl) return "Dibuja tu firma antes de continuar.";
    if(!state.declara_firma) return "Marca la declaración de firma electrónica.";
  }
  return null;
}

async function submitForm(){
  saving = true; saveError = null;
  renderApp();
  try{
    if(!FIREBASE_READY) throw new Error('Firebase no está listo');
    const record = Object.assign({}, state, {
      nombre_buscar: (state.nombre||'').trim().toLowerCase(),
      submittedAtClient: new Date().toISOString(),
      submittedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection(COLLECTION).add(record);
    submitted = true;
  }catch(err){
    saveError = "No se pudo guardar tu firma. Revisa tu conexión e inténtalo nuevamente.";
    console.error(err);
  }
  saving = false;
  renderApp();
}
function nextStep(){
  const err = validateStep();
  if(err){ showErr(err); return; }
  if(state.step === 4){ submitForm(); return; }
  state.step++;
  renderApp();
}
function prevStep(){ state.step--; renderApp(); }

function buildPrintSummary(){
  const rows = [
    ['Nombre completo', state.nombre], ['RUT', state.rut], ['Edad', state.edad],
    ['Teléfono', state.telefono], ['Correo', state.email], ['Fecha', state.fecha], ['Ciudad', state.ciudad]
  ];
  const hist = [
    ['Alergias', ynLabel(state.alergias) + (state.alergias_detalle?` — ${state.alergias_detalle}`:'')],
    ['Diabetes', ynLabel(state.diabetes)], ['Hipertensión', ynLabel(state.hipertension)],
    ['VIH', ynLabel(state.vih)], ['Hepatitis', ynLabel(state.hepatitis)],
    ['Enf. inmunes', ynLabel(state.enf_inmunes)],
    ['Condiciones de piel', ynLabel(state.cond_piel) + (state.cond_piel_detalle?` — ${state.cond_piel_detalle}`:'')],
    ['Herpes', ynLabel(state.herpes) + (state.herpes_detalle?` — ${state.herpes_detalle}`:'')],
    ['Proc. químicos recientes', state.proc_quimicos||'—'], ['Proc. estéticos recientes', state.proc_esteticos||'—']
  ];
  const tec = [
    ['N.° tratamientos anteriores', state.n_tratamientos||'—'], ['Tiempo desde el anterior', state.tiempo_anterior||'—'],
    ['Microblading', ynLabel(state.microblading)], ['Tatuaje', ynLabel(state.tatuaje)],
    ['Técnica realizada', state.tecnica||'—'], ['Diseño aprobado por la clienta', ynLabel(state.diseno_aprobado)]
  ];
  const kv = (arr)=> arr.map(([k,v])=>`<div class="pkv"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('');
  document.getElementById('printSummary').innerHTML = `
    <div class="pmark">Sibana</div>
    <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:#888;">Ficha personal y consentimiento informado — ${esc(state.fecha)}</div>
    <h4>Datos personales</h4>${kv(rows)}
    <h4>Historial médico</h4>${kv(hist)}
    <h4>Técnica realizada</h4>${kv(tec)}
    <h4>Consentimiento</h4>
    <div class="pkv"><b>Acepta términos</b><span>${ynLabel(state.acepta_terminos)}</span></div>
    <div class="pkv"><b>Firma electrónica declarada</b><span>${ynLabel(state.declara_firma)}</span></div>
    <h4>Firma</h4>
    ${state.firmaDataUrl?`<img class="psig" src="${state.firmaDataUrl}">`:''}
  `;
}

function renderApp(){
  if(adminMode){ renderAdmin(); return; }
  if(submitted){
    buildPrintSummary();
    app.innerHTML = `<div class="brand"><div class="mark">Sibana</div></div><div class="wrap">${renderDone()}</div>`;
    document.getElementById('btnDownload').addEventListener('click', ()=> window.print());
    return;
  }
  const steps = [renderStep0, renderStep1, renderStep2, renderStep3, renderStep4];
  app.innerHTML = `
    <div class="brand"><div class="mark">Sibana</div><div class="sub">FICHA Y CONSENTIMIENTO INFORMADO</div></div>
    <div class="wrap">
      ${progressHtml()}
      ${steps[state.step]()}
      <div class="nav-row">
        ${state.step>0 ? `<button class="btn ghost" id="btnBack">Atrás</button>` : `<span></span>`}
        <button class="btn primary" id="btnNext" ${saving?'disabled':''}>${state.step===4 ? (saving?'Guardando…':'Firmar y enviar') : 'Continuar'}</button>
      </div>
    </div>
    <button class="admin-toggle sans" id="adminBtn">Panel Sibana</button>
  `;
  bindInputs();
  if(state.step===4) setupSignaturePad();
  const backBtn = document.getElementById('btnBack');
  if(backBtn) backBtn.addEventListener('click', prevStep);
  document.getElementById('btnNext').addEventListener('click', nextStep);
  document.getElementById('adminBtn').addEventListener('click', openAdminGate);
}

// ---------- Admin panel ----------
let adminMode = false;
let allEntries = [];
let adminLoading = false;
let adminLoadError = null;
let searchTerm = "";

function openAdminGate(){
  // Si este dispositivo ya inició sesión con la cuenta del equipo (por
  // ejemplo porque ya se usó antes en este mismo navegador), entra directo,
  // sin volver a pedir la contraseña — igual que en la Agenda.
  if(teamAuthed){ adminMode = true; loadAdminEntries(); return; }
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `
    <div class="modal sans">
      <h3>Panel Sibana</h3>
      <div class="field"><label>Contraseña del equipo</label><input type="password" id="pcInput" autocomplete="current-password"></div>
      <div class="err sans" id="pcErr"></div>
      <div class="nav-row">
        <button class="btn ghost" id="pcCancel">Cancelar</button>
        <button class="btn primary" id="pcOk">Entrar</button>
      </div>
    </div>`;
  document.body.appendChild(back);
  document.getElementById('pcCancel').addEventListener('click', ()=> back.remove());
  document.getElementById('pcOk').addEventListener('click', ()=>{
    const val = document.getElementById('pcInput').value;
    const okBtn = document.getElementById('pcOk');
    const errBox = document.getElementById('pcErr');
    if(!val){ errBox.classList.add('show'); errBox.textContent = 'Escribe la contraseña.'; return; }
    okBtn.disabled = true;
    firebase.auth().signInWithEmailAndPassword(TEAM_EMAIL, val).then(()=>{
      back.remove();
      adminMode = true;
      loadAdminEntries();
    }).catch(err=>{
      console.error('No se pudo iniciar sesión', err);
      errBox.classList.add('show'); errBox.textContent = 'Contraseña incorrecta.';
      okBtn.disabled = false;
    });
  });
}

async function loadAdminEntries(){
  adminLoading = true; adminLoadError = null;
  renderApp();
  try{
    if(!FIREBASE_READY) throw new Error('Firebase no está listo');
    const snap = await db.collection(COLLECTION).orderBy('submittedAtClient','desc').limit(300).get();
    allEntries = snap.docs.map(d=> Object.assign({_id:d.id}, d.data()));
  }catch(err){
    allEntries = [];
    adminLoadError = "No se pudieron cargar las fichas. Revisa la conexión o las reglas de Firestore.";
    console.error(err);
  }
  adminLoading = false;
  renderApp();
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('es-CL', {day:'2-digit',month:'2-digit',year:'numeric'}) + ' · ' + d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
}

let deleteError = null;
function showConfirm(msg, onConfirm){
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `
    <div class="modal sans">
      <h3>Confirmar</h3>
      <p style="color:var(--cream);font-size:13.5px;line-height:1.5;margin:0 0 4px;">${esc(msg)}</p>
      <div class="nav-row">
        <button class="btn ghost" id="cfCancel">Cancelar</button>
        <button class="btn primary" id="cfOk">Sí, eliminar</button>
      </div>
    </div>`;
  document.body.appendChild(back);
  document.getElementById('cfCancel').addEventListener('click', ()=> back.remove());
  document.getElementById('cfOk').addEventListener('click', ()=>{ back.remove(); onConfirm(); });
}
async function deleteEntry(id){
  deleteError = null;
  try{
    await db.collection(COLLECTION).doc(id).delete();
    allEntries = allEntries.filter(e=>e._id!==id);
  }catch(err){
    console.error(err);
    deleteError = 'No se pudo eliminar la ficha. Revisa tu conexión e inténtalo de nuevo.';
  }
  renderApp();
}
function filteredEntries(){
  if(!searchTerm.trim()) return allEntries;
  const t = searchTerm.trim().toLowerCase();
  return allEntries.filter(e=>
    (e.nombre||'').toLowerCase().includes(t) ||
    (e.rut||'').toLowerCase().includes(t) ||
    (e.telefono||'').toLowerCase().includes(t)
  );
}

function renderAdmin(){
  let body;
  if(adminLoading){
    body = `<div class="empty-admin">Cargando fichas…</div>`;
  } else if(adminLoadError){
    body = `<div class="empty-admin">${esc(adminLoadError)}</div>`;
  } else {
    const list = filteredEntries();
    if(list.length===0){
      body = `<div class="empty-admin">No se encontraron fichas.</div>`;
    } else {
      body = list.map((e,i)=>`
        <div class="entry" data-idx="${i}">
          <div class="entry-top">
            <span class="entry-name">${esc(e.nombre)||'Sin nombre'}</span>
            <span class="entry-meta">${fmtDate(e.submittedAtClient)}</span>
          </div>
          <div class="entry-body">
            <div class="kv"><b>RUT</b><span>${esc(e.rut)}</span></div>
            <div class="kv"><b>Edad</b><span>${esc(e.edad)}</span></div>
            <div class="kv"><b>Teléfono</b><span>${esc(e.telefono)}</span></div>
            <div class="kv"><b>Correo</b><span>${esc(e.email)}</span></div>
            <div class="kv"><b>Ciudad</b><span>${esc(e.ciudad)}</span></div>
            <div class="kv"><b>Alergias</b><span>${ynLabel(e.alergias)} ${e.alergias_detalle?'— '+esc(e.alergias_detalle):''}</span></div>
            <div class="kv"><b>Diabetes</b><span>${ynLabel(e.diabetes)}</span></div>
            <div class="kv"><b>Hipertensión</b><span>${ynLabel(e.hipertension)}</span></div>
            <div class="kv"><b>VIH</b><span>${ynLabel(e.vih)}</span></div>
            <div class="kv"><b>Hepatitis</b><span>${ynLabel(e.hepatitis)}</span></div>
            <div class="kv"><b>Enf. inmunes</b><span>${ynLabel(e.enf_inmunes)}</span></div>
            <div class="kv"><b>Cond. piel</b><span>${ynLabel(e.cond_piel)} ${e.cond_piel_detalle?'— '+esc(e.cond_piel_detalle):''}</span></div>
            <div class="kv"><b>Herpes</b><span>${ynLabel(e.herpes)} ${e.herpes_detalle?'— '+esc(e.herpes_detalle):''}</span></div>
            <div class="kv"><b>Proc. químicos</b><span>${esc(e.proc_quimicos)}</span></div>
            <div class="kv"><b>Proc. estéticos</b><span>${esc(e.proc_esteticos)}</span></div>
            <div class="kv"><b>Tratam. anteriores</b><span>${esc(e.n_tratamientos)}</span></div>
            <div class="kv"><b>Microblading</b><span>${ynLabel(e.microblading)}</span></div>
            <div class="kv"><b>Tatuaje</b><span>${ynLabel(e.tatuaje)}</span></div>
            <div class="kv"><b>Tiempo trat. anterior</b><span>${esc(e.tiempo_anterior)}</span></div>
            <div class="kv"><b>Técnica</b><span>${esc(e.tecnica)}</span></div>
            <div class="kv"><b>Diseño aprobado</b><span>${ynLabel(e.diseno_aprobado)}</span></div>
            ${e.firmaDataUrl?`<div class="sig-preview"><img src="${e.firmaDataUrl}"></div>`:''}
            <button type="button" class="btn ghost sans" style="margin-top:14px;color:var(--rose);border-color:var(--rose);" data-act="delete-entry" data-id="${esc(e._id)}">Eliminar esta ficha</button>
          </div>
        </div>
      `).join('');
    }
  }
  app.innerHTML = `
    <div class="admin-view">
      <div class="admin-head">
        <div class="brand" style="text-align:left;margin:0;"><div class="mark" style="font-size:24px;">Sibana</div></div>
        <button class="btn ghost sans" id="adminClose">Cerrar panel</button>
      </div>
      <div class="search-row">
        <input type="search" id="searchInput" placeholder="Buscar por nombre, RUT o teléfono" value="${esc(searchTerm)}">
      </div>
      <p class="step-desc sans">${filteredEntries().length} de ${allEntries.length} ficha${allEntries.length===1?'':'s'}.</p>
      ${deleteError ? `<div class="err sans show">${esc(deleteError)}</div>` : ''}
      ${body}
    </div>
  `;
  document.getElementById('adminClose').addEventListener('click', ()=>{ adminMode=false; deleteError=null; renderApp(); });
  const si = document.getElementById('searchInput');
  si.addEventListener('input', (e)=>{ searchTerm = e.target.value; renderApp(); si.focus(); si.selectionStart = si.selectionEnd = si.value.length; });
  document.querySelectorAll('.entry').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('open'));
  });
  document.querySelectorAll('[data-act="delete-entry"]').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const id = btn.dataset.id;
      const entry = allEntries.find(x=>x._id===id);
      showConfirm(`¿Eliminar la ficha de ${entry?entry.nombre||'esta clienta':'esta clienta'}? Esta acción no se puede deshacer.`, ()=> deleteEntry(id));
    });
  });
}

renderApp();
</script>
